<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN - Blue Hex Gallery</title>
    <style>
        /* Estilos Cyberpunk / Blue Hex */
        body {
            background-color: #050510;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            margin: 0 0 8px 0;
            font-size: 1.6rem;
        }

        p.subtitulo {
            color: rgba(0, 255, 255, 0.7);
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Grilla: Ventanas una al lado de la otra */
        .galeria-grid {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            justify-content: center;
        }

        /* Tarjeta reducida de cada Canción */
        .tarjeta-tema {
            background: rgba(0, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .tarjeta-tema:hover {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
            transform: translateY(-3px);
        }

        /* Miniatura formato 16:9 compacta */
        .contenedor-miniatura {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background-color: #000;
            overflow: hidden;
            display: block;
            text-decoration: none;
        }

        .miniatura-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, filter 0.3s ease;
        }

        .tarjeta-tema:hover .miniatura-img {
            transform: scale(1.08);
            filter: brightness(1.1);
        }

        /* Botón Play Superpuesto compacto */
        .overlay-play {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
        }

        .tarjeta-tema:hover .overlay-play {
            background: rgba(5, 5, 16, 0.1);
        }

        .icono-play {
            width: 42px;
            height: 42px;
            background: rgba(0, 5, 16, 0.85);
            border: 1.5px solid #00ffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ffff;
            font-size: 16px;
            box-shadow: 0 0 10px #00ffff;
            transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
            padding-left: 2px;
        }

        .tarjeta-tema:hover .icono-play {
            transform: scale(1.15);
            box-shadow: 0 0 18px #00ffff;
            background: #00ffff;
            color: #050510;
        }

        /* Información y título del Tema */
        .info-tema {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(0, 255, 255, 0.15);
            flex-grow: 1;
            justify-content: space-between;
        }

        .titulo-cancion {
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.8px;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-escuchar {
            display: block;
            text-align: center;
            color: #00ffff;
            text-decoration: none;
            border: 1px solid #00ffff;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-escuchar:hover {
            background: #00ffff;
            color: #050510;
            box-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Blue Hex // GEN</h1>
        <p class="subtitulo">Haz clic en un tema para verlo en YouTube</p>
    </header>

    <div class="galeria-grid">

        <!-- VENTANA 1 -->
        <div class="tarjeta-tema" data-url="https://www.youtube.com/watch?v=B8XzBqZQyD8">
            <a href="#" target="_blank" class="contenedor-miniatura link-yt">
                <img src="" alt="Portada" class="miniatura-img">
                <div class="overlay-play">
                    <div class="icono-play">&#9654;</div>
                </div>
            </a>
            <div class="info-tema">
                <h3 class="titulo-cancion">01. LO TENGO EN LOS PIES</h3>
                <a href="#" target="_blank" class="btn-escuchar link-yt">Ver en YouTube</a>
            </div>
        </div>

        <!-- VENTANA 2 -->
        <div class="tarjeta-tema" data-url="https://www.youtube.com/watch?v=5x278R_C9Rk">
            <a href="#" target="_blank" class="contenedor-miniatura link-yt">
                <img src="" alt="Portada" class="miniatura-img">
                <div class="overlay-play">
                    <div class="icono-play">&#9654;</div>
                </div>
            </a>
            <div class="info-tema">
                <h3 class="titulo-cancion">02. TOCO LAS ESTRELLAS</h3>
                <a href="#" target="_blank" class="btn-escuchar link-yt">Ver en YouTube</a>
            </div>
        </div>

        <!-- VENTANA 3 -->
        <div class="tarjeta-tema" data-url="https://www.youtube.com/watch?v=nwxQddoIySw">
            <a href="#" target="_blank" class="contenedor-miniatura link-yt">
                <img src="" alt="Portada" class="miniatura-img">
                <div class="overlay-play">
                    <div class="icono-play">&#9654;</div>
                </div>
            </a>
            <div class="info-tema">
                <h3 class="titulo-cancion">03. IMPRESO</h3>
                <a href="#" target="_blank" class="btn-escuchar link-yt">Ver en YouTube</a>
            </div>
        </div>

        <!-- VENTANA 4 -->
        <div class="tarjeta-tema" data-url="https://www.youtube.com/watch?v=hp2FgJbXDak">
            <a href="#" target="_blank" class="contenedor-miniatura link-yt">
                <img src="" alt="Portada" class="miniatura-img">
                <div class="overlay-play">
                    <div class="icono-play">&#9654;</div>
                </div>
            </a>
            <div class="info-tema">
                <h3 class="titulo-cancion">04. SOLO VERNOS</h3>
                <a href="#" target="_blank" class="btn-escuchar link-yt">Ver en YouTube</a>
            </div>
        </div>

        

    </div>

    <script>
        function extraerVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const tarjetas = document.querySelectorAll('.tarjeta-tema');

        tarjetas.forEach((tarjeta) => {
            const url = tarjeta.getAttribute('data-url');
            const videoId = extraerVideoID(url);

            if (videoId) {
                // Carga la miniatura en alta resolución
                const img = tarjeta.querySelector('.miniatura-img');
                img.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

                // Aplica los enlaces directos
                const links = tarjeta.querySelectorAll('.link-yt');
                links.forEach(link => {
                    link.href = `https://www.youtube.com/watch?v=${videoId}`;
                });
            }
        });
    </script>
</body>
</html>
